# Simulator-only fallback for Macs where the asset catalog will not compile.
# NOT for the App Store. Use:  xcodegen --spec project-noassets.yml
# Every value you must change contains CHANGEME. See SETUP.md.
name: PollCall
options:
  bundleIdPrefix: com.elliottdavid
  deploymentTarget:
    iOS: "17.0"
targets:
  PollCall:
    type: application
    platform: iOS
    sources:
      - path: PollCall
        excludes:
          - "Assets.xcassets"
          - "Assets.xcassets/**"
      - path: FallbackIcons
        buildPhase: resources
    info:
      path: PollCall/Info.plist
      properties:
        CFBundleDisplayName: Poll Call
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [AppIcon60x60]
        UILaunchScreen: {}
        CivicAPIKey: "AIzaSyCI-2nRwi3X4d3zcijYCfmow9dTpIk-KZs"
        NSLocationWhenInUseUsageDescription: "Your location is used to find the polling places and early voting sites for your address."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elliottdavid.PollCall
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
